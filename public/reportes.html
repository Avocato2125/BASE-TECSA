<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes Finalizados — TECSA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg:      #080c10;
    --surface: #0e1318;
    --surface2:#131920;
    --border:  #1c2530;
    --border2: #243040;
    --accent:  #e8b84b;
    --accent2: #4b8ee8;
    --green:   #4be88a;
    --red:     #e84b4b;
    --orange:  #e87b4b;
    --text:    #d0dce8;
    --muted:   #5070a0;
    --radius:  10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family:'Inter',sans-serif; min-height:100vh;
  }

  .topbar {
    background: var(--surface); border-bottom:1px solid var(--border);
    padding:14px 28px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  .topbar-brand { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; color:var(--accent); letter-spacing:1px; }
  .topbar-sub   { font-size:12px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }
  .btn-volver {
    background:transparent; border:1px solid var(--border2); border-radius:8px;
    padding:8px 16px; color:var(--muted); font-size:13px; cursor:pointer;
    font-family:'Inter',sans-serif; transition:all 0.18s; text-decoration:none; display:inline-block;
  }
  .btn-volver:hover { border-color:var(--accent); color:var(--accent); }

  .main { max-width:1200px; margin:0 auto; padding:24px 28px 60px; }

  .tabs {
    display:flex; gap:4px; margin-bottom:18px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); padding:4px; width:fit-content;
  }
  .tab-btn {
    padding:9px 22px; border-radius:7px; border:none; background:transparent;
    color:var(--muted); font-family:'Inter',sans-serif; font-size:13px;
    font-weight:500; cursor:pointer; transition:all 0.18s;
  }
  .tab-btn.active { background:var(--surface2); color:var(--text); border:1px solid var(--border2); }

  .filtros { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .filtros input, .filtros select {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 13px; color:var(--text); font-size:13px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 0.18s;
  }
  .filtros input:focus, .filtros select:focus { border-color:var(--accent2); }
  .filtros input::placeholder { color:var(--muted); }

  .tabla-wrap {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
  }
  table { width:100%; border-collapse:collapse; }
  thead th {
    background:var(--surface2); padding:11px 14px; text-align:left;
    font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--muted); font-weight:600; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td {
    padding:12px 14px; font-size:13px; border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:rgba(75,142,232,0.04); }
  .folio { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); }
  .unidad-td { font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:700; color:var(--text); }
  .chip {
    display:inline-block; background:rgba(75,142,232,0.1);
    border:1px solid rgba(75,142,232,0.25); color:var(--accent2);
    border-radius:5px; padding:2px 8px; font-size:10px; margin:1px 2px 1px 0;
  }
  .btn-pdf {
    background:rgba(232,184,75,0.1); border:1px solid rgba(232,184,75,0.3);
    color:var(--accent); border-radius:7px; padding:6px 14px; font-size:12px;
    font-weight:500; cursor:pointer; font-family:'Inter',sans-serif;
    transition:all 0.18s; white-space:nowrap;
  }
  .btn-pdf:hover { background:rgba(232,184,75,0.2); border-color:var(--accent); }
  .btn-pdf:disabled { opacity:0.5; cursor:not-allowed; }

  .vacio, .cargando {
    padding:50px 20px; text-align:center; color:var(--muted); font-size:14px;
  }
  .contador { font-size:12px; color:var(--muted); margin-bottom:10px; }

  /* Reporte diario */
  .panel-diario { display:none; }
  .diario-barra { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .diario-barra input {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 13px; color:var(--text); font-size:13px; font-family:'Inter',sans-serif; outline:none;
    color-scheme:dark;
  }
  .btn-acc {
    background:rgba(75,142,232,0.1); border:1px solid rgba(75,142,232,0.3); color:var(--accent2);
    border-radius:8px; padding:9px 16px; font-size:13px; font-weight:500; cursor:pointer;
    font-family:'Inter',sans-serif; transition:all 0.18s;
  }
  .btn-acc:hover { border-color:var(--accent2); background:rgba(75,142,232,0.2); }
  .btn-acc:disabled { opacity:0.5; cursor:wait; }
  .resumen-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px; }
  .res-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; }
  .res-lbl { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:6px; }
  .res-val { font-family:'Rajdhani',sans-serif; font-size:26px; font-weight:700; color:var(--accent); line-height:1; }
  .sec-diario { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; letter-spacing:1px;
    color:var(--text); margin:22px 0 10px; padding-left:10px; border-left:3px solid var(--accent); }
  .tabla-wrap.scroll { overflow-x:auto; }
  .tabla-wrap.scroll table { min-width:900px; }
  .msg-diario { font-size:12px; margin-left:4px; }
  .lbl-mini { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; }
  .lbl-mini select {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 13px; color:var(--text); font-size:13px; font-family:'Inter',sans-serif; outline:none;
  }
  .modo-sel { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:3px; }
  .modo-btn {
    background:transparent; border:none; border-radius:6px; padding:7px 14px; color:var(--muted);
    font-size:12px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.15s;
  }
  .modo-btn.activo { background:var(--surface2); color:var(--accent); box-shadow:inset 0 0 0 1px var(--border2); }
  .btn-atajo {
    background:transparent; border:1px solid var(--border2); border-radius:20px; padding:6px 14px;
    color:var(--muted); font-size:12px; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.18s;
  }
  .btn-atajo:hover { border-color:var(--accent); color:var(--accent); }
  .resumen-grid { grid-template-columns:repeat(5,1fr) !important; }
  .fila-click { cursor:pointer; }
  .fila-click td:first-child::before { content:'\25B8'; color:var(--accent); margin-right:8px; display:inline-block; transition:transform .15s; }
  .fila-click.abierta td:first-child::before { transform:rotate(90deg); }
  .fila-det td { background:rgba(75,142,232,0.04); padding:12px 18px; }
  .det-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .det-tit { font-size:10px; text-transform:uppercase; letter-spacing:1.2px; color:var(--muted); margin-bottom:6px; }
  .det-item { font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); }
  .det-item:last-child { border-bottom:none; }
  .det-motivo { color:var(--muted); }
  .sub-diario { font-size:11px; color:var(--muted); margin:-4px 0 8px 13px; }

  @media(max-width:760px) {
    .resumen-grid { grid-template-columns:repeat(2,1fr) !important; }
    .det-grid { grid-template-columns:1fr; }
    .main { padding:16px 14px 40px; }
    .topbar { padding:12px 16px; }
    thead th:nth-child(4), tbody td:nth-child(4) { display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-brand">TECSA</div>
    <div class="topbar-sub">Reportes Finalizados</div>
  </div>
  <a href="/index.html" class="btn-volver">&#8592; Volver al dashboard</a>
</div>

<div class="main">

  <div class="tabs">
    <button class="tab-btn active" id="tab-taller"     onclick="cambiarTipo('taller')">Taller</button>
    <button class="tab-btn"        id="tab-auditoria"  onclick="cambiarTipo('auditoria')">Auditorias</button>
    <button class="tab-btn"        id="tab-proveedor"  onclick="cambiarTipo('proveedor')">Proveedores</button>
    <button class="tab-btn"        id="tab-diario"     onclick="cambiarTipo('diario')">Reporte diario</button>
  </div>

  <div class="filtros">
    <input type="text" id="filtroTexto" placeholder="Buscar por unidad, folio, operador..." oninput="render()">
    <input type="date" id="filtroDesde" onchange="render()" title="Desde">
    <input type="date" id="filtroHasta" onchange="render()" title="Hasta">
    <button class="btn-volver" onclick="limpiarFiltros()">Limpiar</button>
  </div>

  <div class="panel-diario" id="panelDiario">
    <div class="diario-barra">
      <div class="modo-sel">
        <button class="modo-btn activo" id="modoDia" onclick="setModo('dia')">Un dia</button>
        <button class="modo-btn" id="modoRango" onclick="setModo('rango')">Periodo</button>
      </div>
      <label class="lbl-mini"><span id="lblDesde">Fecha</span> <input type="date" id="fechaDesde" onchange="cargarDiario()"></label>
      <label class="lbl-mini" id="bloqueHasta" style="display:none">Hasta <input type="date" id="fechaHasta" onchange="cargarDiario()"></label>
      <label class="lbl-mini">Planta
        <select id="plantaDiario" onchange="cargarDiario()"><option value="">Todas</option></select>
      </label>
    </div>
    <div class="diario-barra">
      <button class="btn-atajo" onclick="atajo('hoy')">Hoy</button>
      <button class="btn-atajo" onclick="atajo('ayer')">Ayer</button>
      <button class="btn-atajo" onclick="atajo('semana')">Esta semana</button>
      <button class="btn-atajo" onclick="atajo('mes')">Este mes</button>
      <button class="btn-atajo" onclick="atajo('mesAnt')">Mes anterior</button>
      <span style="flex:1"></span>
      <button class="btn-pdf" id="btnPdfDiario" onclick="descargarPdfDiario()">Descargar PDF</button>
      <button class="btn-acc" id="btnSheetsDiario" onclick="guardarSheetsDiario()">Guardar pestaña en Sheets</button>
    </div>
    <div class="msg-diario" id="msgDiario" style="margin:-8px 0 12px"></div>
    <div id="contDiario"></div>
  </div>

  <div class="contador" id="contador"></div>

  <div class="tabla-wrap">
    <div id="contenido"><div class="cargando">Cargando reportes...</div></div>
  </div>

</div>

<script>
var API  = window.location.origin;
var TIPO = 'taller';
var DATOS = [];

function cambiarTipo(t) {
  TIPO = t;
  ['taller','auditoria','proveedor','diario'].forEach(function(x){
    document.getElementById('tab-' + x).classList.toggle('active', x === t);
  });
  var diario = t === 'diario';
  document.getElementById('panelDiario').style.display = diario ? 'block' : 'none';
  document.querySelector('.filtros').style.display     = diario ? 'none' : '';
  document.getElementById('contador').style.display    = diario ? 'none' : '';
  document.querySelector('.tabla-wrap').style.display  = diario ? 'none' : '';
  if (diario) {
    if (!document.getElementById('fechaDesde').value) {
      document.getElementById('fechaDesde').value = hoyISO();
      document.getElementById('fechaHasta').value = hoyISO();
    }
    cargarDiario();
  } else {
    cargar();
  }
}

// ── Reporte de taller por periodo ─────────────────────────────
var REP = null;

function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function hoyISO() { return iso(new Date()); }
function esc(t) {
  return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function msgDiario(txt, color) {
  var el = document.getElementById('msgDiario');
  el.textContent = txt || '';
  el.style.color = color || 'var(--muted)';
}
var MODO = 'dia';
function setModo(m, sinCargar) {
  MODO = m;
  document.getElementById('modoDia').classList.toggle('activo', m === 'dia');
  document.getElementById('modoRango').classList.toggle('activo', m === 'rango');
  document.getElementById('bloqueHasta').style.display = m === 'rango' ? '' : 'none';
  document.getElementById('lblDesde').textContent = m === 'rango' ? 'Desde' : 'Fecha';
  // Al pasar a periodo, si Hasta esta vacio o antes de Desde, se iguala
  var d = document.getElementById('fechaDesde'), hh = document.getElementById('fechaHasta');
  if (m === 'rango' && (!hh.value || hh.value < d.value)) hh.value = d.value;
  if (!sinCargar) cargarDiario();
}

function params() {
  var d = document.getElementById('fechaDesde').value;
  var h = MODO === 'rango' ? (document.getElementById('fechaHasta').value || d) : d;
  var p = document.getElementById('plantaDiario').value;
  return 'desde=' + d + '&hasta=' + h + (p ? '&planta=' + encodeURIComponent(p) : '');
}

// Atajos de periodo (la semana empieza en lunes)
function atajo(tipo) {
  var hoy = new Date(), d = new Date(hoy), h = new Date(hoy);
  if (tipo === 'ayer')   { d.setDate(hoy.getDate() - 1); h = new Date(d); }
  if (tipo === 'semana') { var dif = (hoy.getDay() + 6) % 7; d.setDate(hoy.getDate() - dif); }
  if (tipo === 'mes')    { d = new Date(hoy.getFullYear(), hoy.getMonth(), 1); }
  if (tipo === 'mesAnt') { d = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1); h = new Date(hoy.getFullYear(), hoy.getMonth(), 0); }
  document.getElementById('fechaDesde').value = iso(d);
  document.getElementById('fechaHasta').value = iso(h);
  setModo((tipo === 'hoy' || tipo === 'ayer') ? 'dia' : 'rango');
}

function tablaHTML(cols, filas, vacioTxt, ancha) {
  if (!filas.length) return '<div class="tabla-wrap"><div class="vacio" style="padding:20px">' + vacioTxt + '</div></div>';
  var h = '<div class="tabla-wrap' + (ancha ? ' scroll' : '') + '"><table><thead><tr>';
  cols.forEach(function(c){ h += '<th>' + c[0] + '</th>'; });
  h += '</tr></thead><tbody>';
  filas.forEach(function(f){
    h += '<tr>';
    cols.forEach(function(c){
      var v = esc(typeof c[1] === 'function' ? c[1](f) : f[c[1]]);
      if (c[1] === 'folio')  v = '<span class="folio">' + v + '</span>';
      if (c[1] === 'unidad') v = '<span class="unidad-td">' + v + '</span>';
      h += '<td' + (c[2] ? ' style="' + c[2] + '"' : '') + '>' + (v || '—') + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

// Tabla cuyas filas se despliegan al hacer clic para mostrar el detalle
function tablaDesplegable(id, cols, filas, detalleFn, vacioTxt) {
  if (!filas.length) return '<div class="tabla-wrap"><div class="vacio" style="padding:20px">' + vacioTxt + '</div></div>';
  var h = '<div class="tabla-wrap"><table><thead><tr>';
  cols.forEach(function(c){ h += '<th>' + c[0] + '</th>'; });
  h += '</tr></thead><tbody>';
  filas.forEach(function(f, i){
    h += '<tr class="fila-click" onclick="toggleDet(this,\'' + id + i + '\')">';
    cols.forEach(function(c){ h += '<td>' + esc(f[c[1]]) + '</td>'; });
    h += '</tr><tr class="fila-det" id="' + id + i + '" style="display:none"><td colspan="' + cols.length + '">'
       + detalleFn(f) + '</td></tr>';
  });
  return h + '</tbody></table></div>';
}
function toggleDet(tr, id) {
  var det = document.getElementById(id);
  var abrir = det.style.display === 'none';
  det.style.display = abrir ? '' : 'none';
  tr.classList.toggle('abierta', abrir);
}

function listaDet(titulo, items, lineaFn) {
  var h = '<div><div class="det-tit">' + titulo + ' (' + items.length + ')</div>';
  if (!items.length) return h + '<div class="det-item det-motivo">Ninguna</div></div>';
  items.forEach(function(d){ h += '<div class="det-item">' + lineaFn(d) + '</div>'; });
  return h + '</div>';
}

function llenarPlantas(catalogo) {
  var sel = document.getElementById('plantaDiario');
  var actual = sel.value;
  var ya = Array.from(sel.options).map(function(o){ return o.value; });
  (catalogo || []).forEach(function(p){
    if (ya.indexOf(p) === -1) { var o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); }
  });
  sel.value = actual;
}

async function cargarDiario() {
  var cont = document.getElementById('contDiario');
  cont.innerHTML = '<div class="cargando">Armando el reporte...</div>';
  msgDiario('');
  try {
    var res  = await fetch(API + '/api/reporte-diario?' + params());
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error');
    var r = REP = data.reporte, s = r.resumen;
    llenarPlantas(r.catalogoPlantas);
    var dia = r.esDia;
    var chico = 'font-size:12px;color:var(--muted);max-width:260px';

    var h = '<div class="resumen-grid">'
      + '<div class="res-card"><div class="res-lbl">Entraron a taller</div><div class="res-val">' + s.entraron + '</div></div>'
      + '<div class="res-card"><div class="res-lbl">' + (dia ? 'Finalizados del dia' : 'Finalizados que entraron en el periodo') + '</div><div class="res-val">' + s.finPeriodo + '</div></div>'
      + '<div class="res-card"><div class="res-lbl">' + (dia ? 'Finalizados de dias anteriores' : 'Finalizados que entraron antes') + '</div><div class="res-val">' + s.finAnteriores + '</div></div>'
      + '<div class="res-card"><div class="res-lbl">Activos al cierre</div><div class="res-val">' + s.activos + '</div></div>'
      + '<div class="res-card"><div class="res-lbl">Tiempo promedio de reparacion</div><div class="res-val" style="font-size:20px">' + (s.promedio || '—') + '</div>'
      +   (s.promedioN ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">sobre ' + s.promedioN + ' reportes</div>' : '') + '</div>'
      + '</div>';

    h += '<div class="sec-diario">Reportes finalizados</div>' + tablaHTML([
      ['Folio','folio'], ['Unidad','unidad'], ['Operador','operador'], ['Planta','planta'],
      ['Area servicio','areaServicio'], ['Entrada','fechaEntrada'], ['Salida','fechaSalida'],
      ['Tiempo','tiempo'], ['Mecanico','mecanico'], ['Reporte de falla','reporteFalla',chico],
      ['Servicios realizados','servicios',chico],
    ], r.finalizados, 'Sin reportes finalizados en el periodo.', true);

    var colsAct = [
      ['Folio','folio'], ['Unidad','unidad'], ['Operador','operador'], ['Planta','planta'],
      ['Area servicio','areaServicio'], ['Entrada', function(a){ return a.fechaEntrada + ' ' + (a.horaEntrada || ''); }],
      ['Tiempo en taller','tiempo'], ['Reporte de falla','reporteFalla',chico],
    ];
    h += '<div class="sec-diario">Siguen activos al cierre — ' + (dia ? 'entraron este dia' : 'entraron en el periodo') + '</div>'
       + tablaHTML(colsAct, r.activosPeriodo, 'Ninguna.', true);
    h += '<div class="sec-diario">Siguen activos al cierre — ' + (dia ? 'de dias anteriores' : 'de antes del periodo') + '</div>'
       + tablaHTML(colsAct, r.activosAnteriores, 'Ninguna.', true);

    h += '<div class="sec-diario">Impacto por planta</div><div class="sub-diario">Toca una planta para ver sus folios.</div>'
       + tablaDesplegable('pl', [['Planta','planta'], ['Activas al cierre','activas'], ['Finalizadas','finalizadas']],
         r.plantas, function(p){
           var linea = function(d){
             return '<span class="folio">' + esc(d.folio) + '</span> &middot; Unidad <b>' + esc(d.unidad) + '</b> &middot; ' + esc(d.area)
               + (d.tiempo ? ' &middot; ' + esc(d.tiempo) : '')
               + (d.motivo ? '<br><span class="det-motivo">' + esc(d.motivo) + '</span>' : '');
           };
           return '<div class="det-grid">' + listaDet('Activas', p.detalleActivas, linea)
                + listaDet('Finalizadas', p.detalleFinalizadas, linea) + '</div>';
         }, 'Sin movimientos.');

    h += '<div class="sec-diario">Consumo de liquidos</div><div class="sub-diario">Toca un concepto para ver a que folios corresponde.</div>'
       + tablaDesplegable('lq', [['Concepto','concepto'], ['Litros','litros'], ['Unidades','unidades']],
         r.liquidos, function(l){
           return listaDet('Detalle', l.detalle, function(d){
             return '<span class="folio">' + esc(d.folio) + '</span> &middot; Unidad <b>' + esc(d.unidad) + '</b> &middot; ' + esc(d.litros) + ' L';
           });
         }, 'Sin consumo de liquidos registrado.');

    h += '<div class="sec-diario">Consumo de refacciones</div>' + tablaHTML([
      ['Folio','folio'], ['Unidad','unidad'], ['Area','area'], ['Pieza','pieza'], ['Material / detalle','material',chico],
    ], r.piezas, 'Sin piezas cambiadas registradas.');

    cont.innerHTML = h;
  } catch(e) {
    cont.innerHTML = '<div class="vacio">No se pudo armar el reporte: ' + esc(e.message) + '</div>';
  }
}

async function descargarPdfDiario() {
  var btn = document.getElementById('btnPdfDiario');
  btn.disabled = true; btn.textContent = 'Generando...';
  try {
    var res = await fetch(API + '/api/reporte-diario-pdf?' + params());
    if (!res.ok) throw new Error(await res.text());
    var cd = res.headers.get('Content-Disposition') || '';
    var nombre = (cd.match(/filename="([^"]+)"/) || [])[1] || 'Reporte_Taller.pdf';
    var blob = await res.blob();
    var url  = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  } catch(e) {
    alert('No se pudo generar el PDF: ' + e.message);
  }
  btn.disabled = false; btn.textContent = 'Descargar PDF';
}

async function guardarSheetsDiario() {
  var btn = document.getElementById('btnSheetsDiario');
  btn.disabled = true; msgDiario('Escribiendo pestaña...');
  try {
    var res  = await fetch(API + '/api/reporte-diario/sheets?' + params(), { method: 'POST' });
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error');
    msgDiario('Pestaña "' + data.hoja + '" guardada', 'var(--green)');
  } catch(e) {
    msgDiario('Error: ' + e.message, 'var(--red)');
  }
  btn.disabled = false;
}

function limpiarFiltros() {
  document.getElementById('filtroTexto').value = '';
  document.getElementById('filtroDesde').value = '';
  document.getElementById('filtroHasta').value = '';
  render();
}

async function cargar() {
  document.getElementById('contenido').innerHTML = '<div class="cargando">Cargando reportes...</div>';
  document.getElementById('contador').textContent = '';
  try {
    var res  = await fetch(API + '/api/reportes?tipo=' + TIPO);
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error');
    DATOS = data.reportes || [];
    render();
  } catch(e) {
    document.getElementById('contenido').innerHTML =
      '<div class="vacio">No se pudieron cargar los reportes: ' + e.message + '</div>';
  }
}

// dd/MM/yyyy -> Date (para comparar con los filtros de fecha)
function aFecha(str) {
  if (!str) return null;
  var p = String(str).trim().split('/');
  if (p.length !== 3) return null;
  return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
}

function filtrar() {
  var txt   = document.getElementById('filtroTexto').value.trim().toLowerCase();
  var desde = document.getElementById('filtroDesde').value;
  var hasta = document.getElementById('filtroHasta').value;
  var dDesde = desde ? new Date(desde + 'T00:00:00') : null;
  var dHasta = hasta ? new Date(hasta + 'T23:59:59') : null;

  return DATOS.filter(function(r) {
    if (txt) {
      var blob = Object.keys(r).map(function(k){ return r[k]; }).join(' ').toLowerCase();
      if (blob.indexOf(txt) === -1) return false;
    }
    if (dDesde || dHasta) {
      var f = aFecha(r.fecha);
      if (!f) return false;
      if (dDesde && f < dDesde) return false;
      if (dHasta && f > dHasta) return false;
    }
    return true;
  });
}

function render() {
  var lista = filtrar();
  var cont  = document.getElementById('contenido');
  document.getElementById('contador').textContent =
    lista.length + (lista.length === 1 ? ' reporte' : ' reportes');

  if (!lista.length) {
    cont.innerHTML = '<div class="vacio">No hay reportes que coincidan.</div>';
    return;
  }

  var html = '<table><thead><tr>';
  if (TIPO === 'taller') {
    html += '<th>Folio</th><th>Unidad</th><th>Fecha</th><th>Operador</th><th>Mecanico</th><th>Areas</th><th></th>';
  } else if (TIPO === 'auditoria') {
    html += '<th>Folio</th><th>Unidad</th><th>Fecha</th><th>Operador</th><th>Auditor</th><th>Planta</th><th></th>';
  } else {
    html += '<th>Folio</th><th>Proveedor</th><th>Entrada</th><th>Salida</th><th>Trabajo</th><th></th>';
  }
  html += '</tr></thead><tbody>';

  lista.forEach(function(r) {
    html += '<tr>';
    if (TIPO === 'taller') {
      var areas = (r.areas || []).map(function(a){
        return '<span class="chip">' + a.replace('Reporte ','') + '</span>';
      }).join('');
      html += '<td class="folio">' + r.folio + '</td>'
            + '<td class="unidad-td">' + r.unidad + '</td>'
            + '<td>' + r.fecha + '<br><span style="font-size:11px;color:var(--muted)">' + (r.hora||'') + '</span></td>'
            + '<td>' + (r.operador||'—') + '</td>'
            + '<td>' + (r.mecanico||'—') + '</td>'
            + '<td>' + areas + '</td>';
    } else if (TIPO === 'auditoria') {
      html += '<td class="folio">' + r.folio + '</td>'
            + '<td class="unidad-td">' + r.unidad + '</td>'
            + '<td>' + r.fecha + '<br><span style="font-size:11px;color:var(--muted)">' + (r.hora||'') + '</span></td>'
            + '<td>' + (r.operador||'—') + '</td>'
            + '<td>' + (r.auditor||'—') + '</td>'
            + '<td>' + (r.planta||'—') + '</td>';
    } else {
      html += '<td class="folio">' + r.folio + '</td>'
            + '<td style="font-weight:500">' + (r.proveedor||'—') + '</td>'
            + '<td>' + r.fecha + '<br><span style="font-size:11px;color:var(--muted)">' + (r.hora||'') + '</span></td>'
            + '<td>' + (r.fechaSalida||'—') + '<br><span style="font-size:11px;color:var(--muted)">' + (r.horaSalida||'') + '</span></td>'
            + '<td style="font-size:12px;color:var(--muted);max-width:260px">' + (r.trabajoRealizado || r.trabajo || '—') + '</td>';
    }
    html += '<td><button class="btn-pdf" onclick="abrirPDF(this,\'' + encodeURIComponent(r.folio) + '\')">Imprimir PDF</button></td>'
          + '</tr>';
  });

  html += '</tbody></table>';
  cont.innerHTML = html;
}

// El PDF tarda unos segundos porque descarga las fotos de Drive,
// por eso se avisa en el boton mientras se genera.
// Auditorias: el PDF ya existe en Drive, solo lo abrimos.
// Taller/Proveedor: lo genera el servidor, puede tardar si trae fotos.
async function abrirPDF(btn, folioEnc) {
  var folio = decodeURIComponent(folioEnc);

  if (TIPO === 'auditoria') {
    var rep = DATOS.find(function(r){ return String(r.folio) === folio; });
    if (rep && rep.pdfUrl) window.open(rep.pdfUrl, '_blank');
    else alert('Esta auditoria no tiene PDF guardado en Drive.');
    return;
  }

  var original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando...';

  try {
    await pedirPDF(folioEnc, false);
  } catch(e) {
    if (e && e.sinFotos) {
      // El servidor no pudo recuperar las fotos: preguntamos antes de seguir
      btn.disabled = false;
      btn.textContent = original;
      var seguir = confirm(
        'Fotos no disponibles para este reporte.\n\n' +
        'Desea generar el reporte sin fotografias?'
      );
      if (!seguir) return;
      btn.disabled = true;
      btn.textContent = 'Generando...';
      try {
        await pedirPDF(folioEnc, true);
      } catch(e2) {
        alert('No se pudo generar el PDF: ' + (e2.message || e2));
      }
    } else {
      alert('No se pudo generar el PDF: ' + (e.message || e));
    }
  }

  btn.disabled = false;
  btn.textContent = original;
}

// Descarga el PDF como blob para poder leer los errores del servidor
// (window.open no permite distinguir un PDF de un mensaje de error).
async function pedirPDF(folioEnc, sinFotos) {
  var url = API + '/api/reporte-pdf?tipo=' + TIPO + '&folio=' + folioEnc
          + (sinFotos ? '&sinFotos=1' : '');
  var res = await fetch(url);

  if (res.status === 409) {
    var data = await res.json().catch(function(){ return {}; });
    var err  = new Error(data.error || 'Sin fotos');
    err.sinFotos = true;
    throw err;
  }
  if (!res.ok) throw new Error(await res.text());

  var blob = await res.blob();
  var obj  = URL.createObjectURL(blob);
  window.open(obj, '_blank');
  setTimeout(function(){ URL.revokeObjectURL(obj); }, 60000);
}

cargar();
</script>
