<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes Finalizados — TECSA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --bg:      #080c10;
    --surface: #0e1318;
    --surface2:#131920;
    --border:  #1c2530;
    --border2: #243040;
    --accent:  #e8b84b;
    --accent2: #4b8ee8;
    --green:   #4be88a;
    --red:     #e84b4b;
    --orange:  #e87b4b;
    --text:    #d0dce8;
    --muted:   #5070a0;
    --radius:  10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family:'Inter',sans-serif; min-height:100vh;
  }

  .topbar {
    background: var(--surface); border-bottom:1px solid var(--border);
    padding:14px 28px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  .topbar-brand { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; color:var(--accent); letter-spacing:1px; }
  .topbar-sub   { font-size:12px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; }
  .btn-volver {
    background:transparent; border:1px solid var(--border2); border-radius:8px;
    padding:8px 16px; color:var(--muted); font-size:13px; cursor:pointer;
    font-family:'Inter',sans-serif; transition:all 0.18s; text-decoration:none; display:inline-block;
  }
  .btn-volver:hover { border-color:var(--accent); color:var(--accent); }

  .main { max-width:1200px; margin:0 auto; padding:24px 28px 60px; }

  .tabs {
    display:flex; gap:4px; margin-bottom:18px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); padding:4px; width:fit-content;
  }
  .tab-btn {
    padding:9px 22px; border-radius:7px; border:none; background:transparent;
    color:var(--muted); font-family:'Inter',sans-serif; font-size:13px;
    font-weight:500; cursor:pointer; transition:all 0.18s;
  }
  .tab-btn.active { background:var(--surface2); color:var(--text); border:1px solid var(--border2); }

  .filtros { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .filtros input, .filtros select {
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 13px; color:var(--text); font-size:13px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 0.18s;
  }
  .filtros input:focus, .filtros select:focus { border-color:var(--accent2); }
  .filtros input::placeholder { color:var(--muted); }

  .tabla-wrap {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden;
  }
  table { width:100%; border-collapse:collapse; }
  thead th {
    background:var(--surface2); padding:11px 14px; text-align:left;
    font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--muted); font-weight:600; border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody td {
    padding:12px 14px; font-size:13px; border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:rgba(75,142,232,0.04); }
  .folio { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); }
  .unidad-td { font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:700; color:var(--text); }
  .chip {
    display:inline-block; background:rgba(75,142,232,0.1);
    border:1px solid rgba(75,142,232,0.25); color:var(--accent2);
    border-radius:5px; padding:2px 8px; font-size:10px; margin:1px 2px 1px 0;
  }
  .btn-pdf {
    background:rgba(232,184,75,0.1); border:1px solid rgba(232,184,75,0.3);
    color:var(--accent); border-radius:7px; padding:6px 14px; font-size:12px;
    font-weight:500; cursor:pointer; font-family:'Inter',sans-serif;
    transition:all 0.18s; white-space:nowrap;
  }
  .btn-pdf:hover { background:rgba(232,184,75,0.2); border-color:var(--accent); }
  .btn-pdf:disabled { opacity:0.5; cursor:not-allowed; }

  .vacio, .cargando {
    padding:50px 20px; text-align:center; color:var(--muted); font-size:14px;
  }
  .contador { font-size:12px; color:var(--muted); margin-bottom:10px; }

  @media(max-width:760px) {
    .main { padding:16px 14px 40px; }
    .topbar { padding:12px 16px; }
    thead th:nth-child(4), tbody td:nth-child(4) { display:none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-brand">TECSA</div>
    <div class="topbar-sub">Reportes Finalizados</div>
  </div>
  <a href="/index.html" class="btn-volver">&#8592; Volver al dashboard</a>
</div>

<div class="main">

  <div class="tabs">
    <button class="tab-btn active" id="tab-taller"     onclick="cambiarTipo('taller')">Taller</button>
    <button class="tab-btn"        id="tab-auditoria"  onclick="cambiarTipo('auditoria')">Auditorias</button>
    <button class="tab-btn"        id="tab-proveedor"  onclick="cambiarTipo('proveedor')">Proveedores</button>
  </div>

  <div class="filtros">
    <input type="text" id="filtroTexto" placeholder="Buscar por unidad, folio, operador..." oninput="render()">
    <input type="date" id="filtroDesde" onchange="render()" title="Desde">
    <input type="date" id="filtroHasta" onchange="render()" title="Hasta">
    <button class="btn-volver" onclick="limpiarFiltros()">Limpiar</button>
  </div>

  <div class="contador" id="contador"></div>

  <div class="tabla-wrap">
    <div id="contenido"><div class="cargando">Cargando reportes...</div></div>
  </div>

</div>

<script>
var API  = window.location.origin;
var TIPO = 'taller';
var DATOS = [];

function cambiarTipo(t) {
  TIPO = t;
  ['taller','auditoria','proveedor'].forEach(function(x){
    document.getElementById('tab-' + x).classList.toggle('active', x === t);
  });
  cargar();
}

function limpiarFiltros() {
  document.getElementById('filtroTexto').value = '';
  document.getElementById('filtroDesde').value = '';
  document.getElementById('filtroHasta').value = '';
  render();
}

async function cargar() {
  document.getElementById('contenido').innerHTML = '<div class="cargando">Cargando reportes...</div>';
  document.getElementById('contador').textContent = '';
  try {
    var res  = await fetch(API + '/api/reportes?tipo=' + TIPO);
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error');
    DATOS = data.reportes || [];
    render();
  } catch(e) {
    document.getElementById('contenido').innerHTML =
      '<div class="vacio">No se pudieron cargar los reportes: ' + e.message + '</div>';
  }
}

// dd/MM/yyyy -> Date (para comparar con los filtros de fecha)
function aFecha(str) {
  if (!str) return null;
  var p = String(str).trim().split('/');
  if (p.length !== 3) return null;
  return new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0]));
}

function filtrar() {
  var txt   = document.getElementById('filtroTexto').value.trim().toLowerCase();
  var desde = document.getElementById('filtroDesde').value;
  var hasta = document.getElementById('filtroHasta').value;
  var dDesde = desde ? new Date(desde + 'T00:00:00') : null;
  var dHasta = hasta ? new Date(hasta + 'T23:59:59') : null;

  return DATOS.filter(function(r) {
    if (txt) {
      var blob = Object.keys(r).map(function(k){ return r[k]; }).join(' ').toLowerCase();
      if (blob.indexOf(txt) === -1) return false;
    }
    if (dDesde || dHasta) {
      var f = aFecha(r.fecha);
      if (!f) return false;
      if (dDesde && f < dDesde) return false;
      if (dHasta && f > dHasta) return false;
    }
    return true;
  });
}

function render() {
  var lista = filtrar();
  var cont  = document.getElementById('contenido');
  document.getElementById('contador').textContent =
    lista.length + (lista.length === 1 ? ' reporte' : ' reportes');

  if (!lista.length) {
    cont.innerHTML = '<div class="vacio">No hay reportes que coincidan.</div>';
    return;
  }

  var html = '<table><thead><tr>';
  if (TIPO === 'taller') {
    html += '<th>Folio</th><th>Unidad</th><th>Fecha</th><th>Operador</th><th>Mecanico</th><th>Areas</th><th></th>';
  } else if (TIPO === 'auditoria') {
    html += '<th>Folio</th><th>Unidad</th><th>Fecha</th><th>Operador</th><th>Auditor</th><th>Planta</th><th></th>';
  } else {
    html += '<th>Folio</th><th>Proveedor</th><th>Entrada</th><th>Salida</th><th>Trabajo</th><th></th>';
  }
  html += '</tr></thead><tbody>';

  lista.forEach(function(r) {
    html += '<tr>';
    if (TIPO === 'taller') {
      var areas = (r.areas || []).map(function(a){
        return '<span class="chip">' + a.replace('Reporte ','') + '</span>';
      }).join('');
      html += '<td class="folio">' + r.folio + '</td>'
            + '<td class="unidad-td">' + r.unidad + '</td>'
            + '<td>' + r.fecha + '<br><span style="font-size:11px;color:var(--muted)">' + (r.hora||'') + '</span></td>'
            + '<td>' + (r.operador||'—') + '</td>'
            + '<td>' + (r.mecanico||'—') + '</td>'
            + '<td>' + areas + '</td>';
    } else if (TIPO === 'auditoria') {
      html += '<td class="folio">' + r.folio + '</td>'
            + '<td class="unidad-td">' + r.unidad + '</td>'
            + '<td>' + r.fecha + '<br><span style="font-size:11px;color:var(--muted)">' + (r.hora||'') + '</span></td>'
            + '<td>' + (r.operador||'—') + '</td>'
            + '<td>' + (r.auditor||'—') + '</td>'
            + '<td>' + (r.planta||'—') + '</td>';
    } else {
      html += '<td class="folio">' + r.folio + '</td>'
            + '<td style="font-weight:500">' + (r.proveedor||'—') + '</td>'
            + '<td>' + r.fecha + '<br><span style="font-size:11px;color:var(--muted)">' + (r.hora||'') + '</span></td>'
            + '<td>' + (r.fechaSalida||'—') + '<br><span style="font-size:11px;color:var(--muted)">' + (r.horaSalida||'') + '</span></td>'
            + '<td style="font-size:12px;color:var(--muted);max-width:260px">' + (r.trabajoRealizado || r.trabajo || '—') + '</td>';
    }
    html += '<td><button class="btn-pdf" onclick="abrirPDF(this,\'' + encodeURIComponent(r.folio) + '\')">Imprimir PDF</button></td>'
          + '</tr>';
  });

  html += '</tbody></table>';
  cont.innerHTML = html;
}

// El PDF tarda unos segundos porque descarga las fotos de Drive,
// por eso se avisa en el boton mientras se genera.
// Auditorias: el PDF ya existe en Drive, solo lo abrimos.
// Taller/Proveedor: lo genera el servidor, puede tardar si trae fotos.
async function abrirPDF(btn, folioEnc) {
  var folio = decodeURIComponent(folioEnc);

  if (TIPO === 'auditoria') {
    var rep = DATOS.find(function(r){ return String(r.folio) === folio; });
    if (rep && rep.pdfUrl) window.open(rep.pdfUrl, '_blank');
    else alert('Esta auditoria no tiene PDF guardado en Drive.');
    return;
  }

  var original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando...';

  try {
    await pedirPDF(folioEnc, false);
  } catch(e) {
    if (e && e.sinFotos) {
      // El servidor no pudo recuperar las fotos: preguntamos antes de seguir
      btn.disabled = false;
      btn.textContent = original;
      var seguir = confirm(
        'Fotos no disponibles para este reporte.\n\n' +
        'Desea generar el reporte sin fotografias?'
      );
      if (!seguir) return;
      btn.disabled = true;
      btn.textContent = 'Generando...';
      try {
        await pedirPDF(folioEnc, true);
      } catch(e2) {
        alert('No se pudo generar el PDF: ' + (e2.message || e2));
      }
    } else {
      alert('No se pudo generar el PDF: ' + (e.message || e));
    }
  }

  btn.disabled = false;
  btn.textContent = original;
}

// Descarga el PDF como blob para poder leer los errores del servidor
// (window.open no permite distinguir un PDF de un mensaje de error).
async function pedirPDF(folioEnc, sinFotos) {
  var url = API + '/api/reporte-pdf?tipo=' + TIPO + '&folio=' + folioEnc
          + (sinFotos ? '&sinFotos=1' : '');
  var res = await fetch(url);

  if (res.status === 409) {
    var data = await res.json().catch(function(){ return {}; });
    var err  = new Error(data.error || 'Sin fotos');
    err.sinFotos = true;
    throw err;
  }
  if (!res.ok) throw new Error(await res.text());

  var blob = await res.blob();
  var obj  = URL.createObjectURL(blob);
  window.open(obj, '_blank');
  setTimeout(function(){ URL.revokeObjectURL(obj); }, 60000);
}

cargar();
</script>
</body>
</html>
