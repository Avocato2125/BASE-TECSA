<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria General — TECSA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');

  :root {
    --bg:      #0d0d14;
    --surface: #16161f;
    --border:  #2a2a3d;
    --accent:  #e8b84b;
    --accent2: #4b8ee8;
    --text:    #e8e8f0;
    --muted:   #7070a0;
    --red:     #e84b4b;
    --green:   #4be88a;
    --radius:  10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; padding:24px 16px 60px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(232,184,75,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(75,142,232,0.03) 0%, transparent 50%);
  }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    width:100%; max-width:640px; margin:0 auto; overflow:hidden;
    box-shadow:0 24px 80px rgba(0,0,0,0.5);
  }
  .header {
    background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);
    padding:22px 28px 18px; border-bottom:1px solid var(--border);
  }
  .logo-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .logo-box img { height:46px; object-fit:contain; }
  .brand-sub { font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:2px; margin-bottom:10px; }
  .datetime-row { display:flex; gap:10px; }
  .dt-chip {
    background:rgba(232,184,75,0.08); border:1px solid rgba(232,184,75,0.2);
    border-radius:6px; padding:5px 12px; font-size:13px; color:var(--accent);
    font-family:'Rajdhani',sans-serif; font-weight:600; letter-spacing:0.5px;
  }
  .unidad-banner {
    background:rgba(232,184,75,0.06); border:1px solid rgba(232,184,75,0.2);
    border-radius:10px; padding:14px 18px; margin:20px 28px 0;
    display:flex; align-items:center; gap:16px;
  }
  .unidad-num { font-family:'Rajdhani',sans-serif; font-size:32px; font-weight:700; color:var(--accent); line-height:1; }
  .unidad-info { flex:1; }
  .unidad-info div { font-size:13px; color:var(--text); }
  .unidad-info span { font-size:11px; color:var(--muted); }
  .unidad-folio { font-family:'Rajdhani',sans-serif; font-size:13px; color:var(--accent2); }
  .form-body { padding:24px 28px 28px; }
  .field { margin-bottom:16px; }
  label {
    display:block; font-size:11px; font-weight:500; color:var(--muted);
    letter-spacing:1.2px; text-transform:uppercase; margin-bottom:7px;
  }
  input[type="text"], select, textarea {
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--border);
    border-radius:var(--radius); padding:11px 14px; color:var(--text); font-size:14px;
    font-family:'Inter',sans-serif; outline:none; transition:border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance:none; appearance:none;
  }
  input:focus, select:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,184,75,0.08); }
  select option { background:#16161f; }
  textarea { resize:vertical; min-height:60px; }
  .seccion-title {
    font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; color:var(--accent2);
    letter-spacing:1.5px; text-transform:uppercase; padding:16px 0 10px;
    border-bottom:1px solid rgba(75,142,232,0.2); margin-bottom:10px;
  }
  .seccion-title:first-child { padding-top:0; }
  .punto-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .punto-row:last-child { border-bottom:none; }
  .punto-nombre { flex:1; font-size:13px; color:var(--text); }
  .check-pair { display:flex; gap:6px; }
  .check-btn {
    width:38px; height:32px; border-radius:7px; border:1px solid var(--border);
    background:rgba(255,255,255,0.02); cursor:pointer; display:flex; align-items:center;
    justify-content:center; font-size:15px; color:var(--muted); transition:all 0.15s; user-select:none;
  }
  .check-btn.cumple:hover { border-color:var(--green); color:var(--green); }
  .check-btn.nocumple:hover { border-color:var(--red); color:var(--red); }
  .check-btn.cumple.selected { background:rgba(75,232,138,0.15); border-color:var(--green); color:var(--green); }
  .check-btn.nocumple.selected { background:rgba(232,75,75,0.15); border-color:var(--red); color:var(--red); }
  .obs-input {
    width:100%; margin-top:6px; display:none; background:rgba(232,75,75,0.04);
    border:1px solid rgba(232,75,75,0.2); border-radius:6px; padding:7px 10px;
    color:var(--text); font-size:12px; font-family:'Inter',sans-serif; outline:none;
  }
  .obs-input.show { display:block; }
  .firma-box { border:1px solid var(--border); border-radius:10px; overflow:hidden; background:rgba(255,255,255,0.02); }
  .firma-canvas { width:100%; height:140px; display:block; touch-action:none; cursor:crosshair; background:#1a1a24; }
  .firma-actions { display:flex; justify-content:flex-end; align-items:center; padding:8px 12px; border-top:1px solid var(--border); }
  .btn-clear-firma {
    background:transparent; border:1px solid var(--border); border-radius:6px;
    padding:6px 12px; color:var(--muted); font-size:11px; cursor:pointer; transition:all 0.15s;
  }
  .btn-clear-firma:hover { border-color:var(--red); color:var(--red); }
  .btn-submit {
    width:100%; background:var(--accent); color:#0d0d14; border:none; border-radius:var(--radius);
    padding:15px; font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase; cursor:pointer; transition:all 0.2s; margin-top:20px;
  }
  .btn-submit:hover:not(:disabled) { background:#f0c45a; transform:translateY(-1px); }
  .btn-submit:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-nueva {
    width:100%; background:transparent; border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; color:var(--muted); font-family:'Inter',sans-serif; font-size:14px;
    cursor:pointer; transition:all 0.18s; margin-top:16px;
  }
  .btn-nueva:hover { border-color:var(--accent); color:var(--accent); }
  .success-panel { display:none; text-align:center; padding:16px 0 8px; }
  .success-check {
    width:56px; height:56px; background:rgba(75,232,138,0.12); border:2px solid rgba(75,232,138,0.4);
    border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  }
  .success-check svg { width:28px; height:28px; stroke:var(--green); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .success-title { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:var(--green); margin-bottom:6px; }
  .success-sub { font-size:13px; color:var(--muted); }
  .error-msg {
    background:rgba(232,75,75,0.08); border:1px solid rgba(232,75,75,0.25); border-radius:8px;
    padding:10px 14px; font-size:13px; color:var(--red); margin-top:12px; display:none;
  }
  @media(max-width:480px) {
    .form-body { padding:18px 16px 20px; }
    .unidad-banner { margin:16px 16px 0; }
    .punto-nombre { font-size:12px; }
  }
</style>
</head>

      <div class="field"><label>Nombre del Auditor</label><input type="text" id="auditorNombre" placeholder="Nombre completo"></div>
      <div class="field"><label>Kilometraje</label><input type="text" id="kilometraje" placeholder="Ej. 125430"></div>

      <div id="puntosContainer"></div>

      <div class="seccion-title">Firmas</div>
      <div class="field">
        <label>Firma del Auditor</label>
        <div class="firma-box">
          <canvas class="firma-canvas" id="firmaAuditor"></canvas>
          <div class="firma-actions"><button type="button" class="btn-clear-firma" onclick="limpiarFirma('firmaAuditor')">Limpiar</button></div>
        </div>
      </div>

      <div class="field"><label>Nombre del Operador</label><input type="text" id="operadorNombreAud" placeholder="Nombre completo"></div>
      <div class="field">
        <label>Firma del Operador</label>
        <div class="firma-box">
          <canvas class="firma-canvas" id="firmaOperador"></canvas>
          <div class="firma-actions"><button type="button" class="btn-clear-firma" onclick="limpiarFirma('firmaOperador')">Limpiar</button></div>
        </div>
      </div>

      <button class="btn-submit" id="btnEnviar" onclick="enviarAuditoria()">Generar Auditoria</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="success-panel" id="successPanel">
      <div class="success-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div class="success-title">Auditoria Generada</div>
      <div class="success-sub">El PDF ha sido guardado correctamente y la unidad fue dada de baja.</div>
      <button class="btn-nueva" onclick="nuevaAuditoria()">Nueva Auditoria</button>
    </div>
  </div>
</div>

<script>
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxE8arD_r_NZe9uqq-cW7mf8HN6hDlRT4yoXaRgb-brm9zGHISBRc2B2i5pYg5thADhGg/exec';
var API_URL = window.location.origin;
var datosUnidad = null;

var SECCIONES = [
  { titulo: 'Documentos Legales', puntos: ['Licencia Vigente','Tarjeton Vigente','Poliza'] },
  { titulo: 'Seguridad', puntos: ['Cinturones de Seguridad','Extintor','Botiquin','Camaras','Parabrisas en Buen Estado'] },
  { titulo: 'Limpieza', puntos: ['Cortinas','Piso','Asientos','Carroceria'] },
  { titulo: 'Personal Operativo', puntos: ['Uniforme Completo','Barba','Zapatos','Sin Gorra','Sin Aretes o Piercing'] },
  { titulo: 'Estado de la Unidad', puntos: ['Luces Largas','Luces Cortas','Faros','Intermitentes','Luces Interiores','Asientos en Buen Estado','Retrovisores Laterales y Central','Neumaticos en Buen Estado','Sin Golpes en Defensa y Laterales','Carroceria sin Dano en la Pintura'] }
];

var puntosEstado = {};

window.addEventListener('load', function() {
  tick();
  setInterval(tick, 1000);
  generarPuntos();
  cargarUnidadesImplant();
});

function tick() {
  var ahora = new Date();
  document.getElementById('fechaDisplay').textContent =
    ahora.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit', year:'numeric' });
  document.getElementById('horaDisplay').textContent =
    ahora.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit', hour12:false });
}

function generarPuntos() {
  var cont = document.getElementById('puntosContainer');
  var html = '';
  SECCIONES.forEach(function(sec, si) {
    html += '<div class="seccion-title">' + sec.titulo + '</div>';
    sec.puntos.forEach(function(p, pi) {
      var id = 's' + si + 'p' + pi;
      puntosEstado[id] = { nombre: p, valor: null, obs: '' };
      html += '<div class="punto-row">'
        + '<div class="punto-nombre">' + p + '</div>'
        + '<div class="check-pair">'
        +   '<div class="check-btn cumple" data-id="' + id + '" data-val="cumple">&#10003;</div>'
        +   '<div class="check-btn nocumple" data-id="' + id + '" data-val="nocumple">&#10007;</div>'
        + '</div></div>'
        + '<input type="text" class="obs-input" id="obs-' + id + '" data-id="' + id + '" placeholder="Observacion...">';
    });
  });
  cont.innerHTML = html;

  // Adjuntar listeners despues de insertar HTML (evita problemas de escape de comillas)
  cont.querySelectorAll('.check-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      marcarPunto(btn.getAttribute('data-id'), btn.getAttribute('data-val'), btn);
    });
  });
  cont.querySelectorAll('.obs-input').forEach(function(inp) {
    inp.addEventListener('change', function() {
      actualizarObs(inp.getAttribute('data-id'), inp.value);
    });
  });
}

function marcarPunto(id, valor, el) {
  puntosEstado[id].valor = valor;
  var row = el.closest('.punto-row');
  row.querySelectorAll('.check-btn').forEach(function(b){ b.classList.remove('selected'); });
  el.classList.add('selected');
  var obsInput = document.getElementById('obs-' + id);
  if (valor === 'nocumple') {
    obsInput.classList.add('show');
  } else {
    obsInput.classList.remove('show');
    obsInput.value = '';
    puntosEstado[id].obs = '';
  }
}

function actualizarObs(id, val) { puntosEstado[id].obs = val; }

var firmaCtx = {};
var firmaDrawing = {};
var firmaInicializada = {};

function initFirma(canvasId) {
  if (firmaInicializada[canvasId]) return; // evitar duplicar listeners
  var canvas = document.getElementById(canvasId);
  var rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return; // aun no visible, no inicializar todavia
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  var ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  ctx.strokeStyle = '#e8b84b';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  firmaCtx[canvasId] = ctx;
  firmaDrawing[canvasId] = false;
  firmaInicializada[canvasId] = true;

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: x, y: y };
  }
  function start(e) { e.preventDefault(); firmaDrawing[canvasId] = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e) { if (!firmaDrawing[canvasId]) return; e.preventDefault(); var p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); }
  function end() { firmaDrawing[canvasId] = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start);
  canvas.addEventListener('touchmove', move);
  canvas.addEventListener('touchend', end);
}

function limpiarFirma(canvasId) {
  var canvas = document.getElementById(canvasId);
  var ctx = firmaCtx[canvasId];
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function firmaTieneContenido(canvasId) {
  var canvas = document.getElementById(canvasId);
  if (!canvas.width || !canvas.height) return false;
  var ctx = canvas.getContext('2d');
  var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
  for (var i = 3; i < data.length; i += 4) { if (data[i] > 0) return true; }
  return false;
}

function firmaToBase64(canvasId) {
  var canvas = document.getElementById(canvasId);
  // Crear un canvas temporal con fondo blanco y trazos en negro
  var tmp = document.createElement('canvas');
  tmp.width  = canvas.width;
  tmp.height = canvas.height;
  var ctx = tmp.getContext('2d');
  // Fondo blanco
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, tmp.width, tmp.height);
  // Redibujar la firma original pero multiplicar color a negro
  // usando compositing: dibujar encima con color negro donde hay trazo
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(canvas, 0, 0);
  // Restaurar y dibujar el resultado final
  ctx.globalCompositeOperation = 'source-over';
  return tmp.toDataURL('image/png').split(',')[1];
}

async function cargarUnidadesImplant() {
  var select = document.getElementById('folioSelect');
  var errEl = document.getElementById('buscarError');
  select.innerHTML = '<option value="">Cargando unidades...</option>';
  try {
    var res = await fetch(API_URL + '/api/unidades');
    var data = await res.json();
    if (!data.ok) throw new Error(data.error);

    var inplant = data.entradas.filter(function(u) {
      return u.motivo && u.motivo.indexOf('Inplant') === 0;
    });

    select.innerHTML = '<option value="">— Selecciona una unidad —</option>';
    if (!inplant.length) {
      select.innerHTML = '<option value="">No hay unidades Inplant activas</option>';
      return;
    }
    inplant.forEach(function(u) {
      var opt = document.createElement('option');
      opt.value = JSON.stringify(u);
      opt.textContent = u.unidad + ' — ' + u.folio + ' (' + u.operador + ')';
      select.appendChild(opt);
    });
  } catch(e) {
    errEl.textContent = 'Error al cargar: ' + e.message;
    errEl.style.display = 'block';
  }
}

// Resetea por completo el formulario (puntos, firmas, campos de texto)
// Se llama cada vez que se selecciona una unidad nueva, para que datos
// de una unidad anterior nunca queden mezclados con la siguiente.
function resetFormularioCompleto() {
  document.getElementById('auditorNombre').value = '';
  document.getElementById('kilometraje').value = '';
  document.getElementById('operadorNombreAud').value = '';
  limpiarFirma('firmaAuditor');
  limpiarFirma('firmaOperador');
  generarPuntos();
  var btn = document.getElementById('btnEnviar');
  btn.disabled = false;
  btn.textContent = 'Generar Auditoria';
  document.getElementById('errorMsg').style.display = 'none';
}

function seleccionarFolio() {
  var select = document.getElementById('folioSelect');
  if (!select.value) {
    datosUnidad = null;
    document.getElementById('unidadBanner').style.display = 'none';
    document.getElementById('formContent').style.display = 'none';
    return;
  }
  var u = JSON.parse(select.value);
  datosUnidad = u;

  // Limpiar cualquier dato dejado por una unidad seleccionada previamente
  resetFormularioCompleto();

  document.getElementById('bannerUnidad').textContent = u.unidad;
  document.getElementById('bannerOperador').textContent = u.operador;
  document.getElementById('bannerPlanta').textContent = extraerPlanta(u.motivo) || '—';
  document.getElementById('bannerFolio').textContent = u.folio;
  document.getElementById('unidadBanner').style.display = 'flex';
  document.getElementById('formContent').style.display = 'block';
  document.getElementById('operadorNombreAud').value = u.operador || '';

  // Inicializar canvas de firma AHORA que el formulario es visible
  // (con un pequeño delay para que el layout termine de calcular el tamaño real)
  setTimeout(function() {
    initFirma('firmaAuditor');
    initFirma('firmaOperador');
  }, 50);
}

function extraerPlanta(motivo) {
  if (!motivo) return '';
  var partes = motivo.split(' — ');
  return partes.length > 1 ? partes[1] : '';
}

// Vuelve a mostrar el selector para hacer otra auditoria,
// con la lista de unidades refrescada (la recien auditada ya no aparece).
function nuevaAuditoria() {
  datosUnidad = null;
  document.getElementById('successPanel').style.display = 'none';
  document.getElementById('unidadBanner').style.display = 'none';
  document.getElementById('formContent').style.display = 'none';
  document.getElementById('buscarSection').style.display = 'block';
  document.getElementById('folioSelect').value = '';
  resetFormularioCompleto();
  cargarUnidadesImplant();
}

async function enviarAuditoria() {
  var btn = document.getElementById('btnEnviar');
  var errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';

  if (!datosUnidad) { errEl.textContent = 'Selecciona una unidad.'; errEl.style.display = 'block'; return; }
  var auditor = document.getElementById('auditorNombre').value.trim();
  if (!auditor) { errEl.textContent = 'Ingresa el nombre del auditor.'; errEl.style.display = 'block'; return; }
  if (!firmaTieneContenido('firmaAuditor')) { errEl.textContent = 'Falta la firma del auditor.'; errEl.style.display = 'block'; return; }
  if (!firmaTieneContenido('firmaOperador')) { errEl.textContent = 'Falta la firma del operador.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Generando...';

  var puntos = Object.keys(puntosEstado).map(function(id) { return puntosEstado[id]; });

  var datos = {
    folio: datosUnidad.folio,
    rowIndex: datosUnidad.rowIndex,
    unidad: datosUnidad.unidad,
    operador: datosUnidad.operador,
    planta: extraerPlanta(datosUnidad.motivo),
    auditor: auditor,
    kilometraje: document.getElementById('kilometraje').value.trim(),
    operadorNombreAud: document.getElementById('operadorNombreAud').value.trim(),
    puntos: puntos,
    firmaAuditor: firmaToBase64('firmaAuditor'),
    firmaOperador: firmaToBase64('firmaOperador')
  };

  try {
    var res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos),
      redirect: 'follow'
    });
    var result = await res.json();

    if (result.ok) {
      // Una vez enviada, esta unidad queda BAJA en el backend.
      // Bloqueamos toda interaccion previa con el formulario y el selector
      // para que no se pueda volver a enviar la misma auditoria.
      datosUnidad = null;
      document.getElementById('buscarSection').style.display = 'none';
      document.getElementById('formContent').style.display = 'none';
      document.getElementById('unidadBanner').style.display = 'none';
      document.getElementById('successPanel').style.display = 'block';

      // Recargar la pagina tras 3 segundos para limpiar firmas y estado
      setTimeout(function() {
        window.location.reload();
      }, 3000);
    } else {
      errEl.textContent = 'Error: ' + (result.error || 'desconocido');
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Generar Auditoria';
    }
  } catch(e) {
    errEl.textContent = 'Error de conexion: ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Generar Auditoria';
  }
}
</script>
</body>
</html>
